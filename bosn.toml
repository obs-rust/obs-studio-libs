# Local producers under bosn (zackees/bosn).
#   bosn run --task linux    build every Linux tool and pack each into
#                            dist/<tool>-<version>-linux-x86_64-glibc2.28-release.tar.zst
# The image is only the toolchain (recipes/linux/Dockerfile). The tools are
# built into /opt/obs-deps/<tool>, which is the host's out/<tool>: the output
# directory is a bind mount, so the results land on the host directly (and keep
# the /opt/obs-deps/<tool> prefix the consumer installs them under).
# Then: obs-studio-libs add dist/*.tar.zst.json --assets <assets-branch checkout>,
# and upload the archives to the <tool>-<version> releases.

[stack.linux]
dockerfile = "recipes/linux/Dockerfile"
family = "obs-studio-libs-linux"
workdir = "/src"

[stack.linux.env]
UV_CACHE_DIR = "/tmp/uv-cache"
# Never in the mounted checkout: a root-owned .venv there breaks the host user.
UV_PROJECT_ENVIRONMENT = "/tmp/uv-venv"

[stack.linux.mounts]
src = { source = ".", destination = "/src" }
out = { source = "out", destination = "/opt/obs-deps" }

[task.linux]
stack = "linux"
cmd = "recipes/linux/build.sh"

# CEF for obs-browser (obs-rust/obs-studio#1864): a Chromium build, so its own
# Ubuntu image, and its checkout and build under the host's out/cef (~150 GB).
# Run in order; re-run build until it finishes (bosn caps a run at 4 h):
#   bosn run --task cef-linux-sync / cef-linux-build / cef-linux-pack
[stack.cef-linux]
dockerfile = "recipes/cef/linux/Dockerfile"
family = "obs-studio-libs-cef-linux"
workdir = "/src"

[stack.cef-linux.mounts]
src = { source = ".", destination = "/src" }
cef = { source = "out/cef", destination = "/cef" }

[task.cef-linux-sync]
stack = "cef-linux"
cmd = "recipes/cef/linux/build.sh sync"

[task.cef-linux-build]
stack = "cef-linux"
cmd = "recipes/cef/linux/build.sh build"

[task.cef-linux-pack]
stack = "cef-linux"
cmd = "recipes/cef/linux/build.sh pack"

# The arm64 half of obs-rust/obs-studio#3062. `bosn run --task` passes no
# arguments, and the architecture is a positional argument of build.sh, so
# arm64 needs its own tasks; sync/build resume in the same out/cef checkout
# and only the out directory (Release_GN_arm64) and the distribution
# (linuxarm64) differ. Pack makes cef_binary_8078_linux_aarch64.tar.xz.
[task.cef-linux-sync-arm64]
stack = "cef-linux"
cmd = "recipes/cef/linux/build.sh sync arm64"

[task.cef-linux-build-arm64]
stack = "cef-linux"
cmd = "recipes/cef/linux/build.sh build arm64"

[task.cef-linux-sync-arm64-force]
stack = "cef-linux"
cmd = "recipes/cef/linux/build.sh sync arm64 --force-update"

[task.cef-linux-pack-arm64]
stack = "cef-linux"
cmd = "recipes/cef/linux/build.sh pack arm64"

# The Windows half of obs-rust/obs-studio#1864 / #2417: a Linux -> Windows
# cross build on the same checkout. automate can sync but has no target-OS
# switch on branch 8078, so `toolchain` packages soldr's xwin payload as the
# depot_tools win_toolchain zip and `build` calls GN with target_os="win".
# Pack makes cef_binary_8078_windows_{x64,arm64}.zip. The two architectures
# write different out directories and distributions, so each needs its own
# tasks.
[task.cef-win-sync]
stack = "cef-linux"
cmd = "recipes/cef/windows/build.sh sync"

[task.cef-win-toolchain]
stack = "cef-linux"
cmd = "recipes/cef/windows/build.sh toolchain"

[task.cef-win-build]
stack = "cef-linux"
cmd = "recipes/cef/windows/build.sh build"

[task.cef-win-pack]
stack = "cef-linux"
cmd = "recipes/cef/windows/build.sh pack"

[task.cef-win-sync-arm64]
stack = "cef-linux"
cmd = "recipes/cef/windows/build.sh sync arm64"

[task.cef-win-build-arm64]
stack = "cef-linux"
cmd = "recipes/cef/windows/build.sh build arm64"

[task.cef-win-pack-arm64]
stack = "cef-linux"
cmd = "recipes/cef/windows/build.sh pack arm64"
