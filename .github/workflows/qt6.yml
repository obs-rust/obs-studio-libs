name: Qt 6
run-name: Qt ${{ inputs.qt_version }} (${{ inputs.platforms }}) ${{ inputs.label }}
# Builds Qt with obs-deps' own recipe and build action (deps.qt/, the
# build-qt action) on the Windows and macOS runners, and Linux (glibc 2.28)
# with recipes/linux/qt6.sh in the manylinux image (recipes/linux/ci-build.sh,
# as linux.yml builds FFmpeg; obs-rust/obs-studio#4837). Repacks each
# platform's result as <tool>-<version>-<platform>.tar.zst (zstd 9,
# `obs-studio-libs pack`), attaches it to the release qt6-<version>, and
# records it in qt6/manifest.json and the root manifest.json on the assets
# branch. A rebuild of a published platform needs a label: published bytes are
# immutable, and the upload refuses an existing name.
on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: Qt version obs-deps builds at obs_deps_ref (checked)
        required: true
        default: 6.11.1
      obs_deps_ref:
        description: obs-rust/obs-deps commit whose deps.qt recipe to build
        required: true
        default: fc89a353445a59c735276489082e6d11f446c6e1
      platforms:
        description: Platforms to build and publish
        type: choice
        options: [all, linux, windows-macos]
        default: all
        required: true
      label:
        description: Optional build label for every asset of this run, e.g. testlib (required to rebuild a published platform)
        required: false
permissions:
  contents: read
concurrency:
  group: qt6-${{ inputs.qt_version }}
  cancel-in-progress: false
jobs:
  build:
    name: Qt ${{ inputs.qt_version }} (${{ matrix.name }})
    if: inputs.platforms != 'linux'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            target: x64
            config: RelWithDebInfo
            platform: os=windows,arch=x86_64,libc=msvc
            variant: optimization=relwithdebinfo
            output: windows/*.zip
          - name: windows-arm64
            runner: windows-11-arm
            target: arm64
            config: RelWithDebInfo
            platform: os=windows,arch=aarch64,libc=msvc
            variant: optimization=relwithdebinfo
            output: windows/*.zip
          - name: macos-universal
            runner: macos-15
            target: macos-universal
            config: Release
            platform: os=darwin,arch=universal2,os_version=11.0
            variant: optimization=release
            output: macos-universal/*.tar.xz
    steps:
      # obs-deps at the workspace root: its build-qt action runs its scripts
      # from there. This repository goes into libs/ (after, since a checkout
      # into the root cleans it).
      - name: Checkout obs-deps
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: obs-rust/obs-deps
          ref: ${{ inputs.obs_deps_ref }}
          persist-credentials: false
      - name: Checkout obs-studio-libs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: libs
          persist-credentials: false
      - name: Check the recipe's Qt version
        shell: bash
        env:
          QT_VERSION: ${{ inputs.qt_version }}
        run: |
          grep -q "^local version=${QT_VERSION}\$" deps.qt/qt6.zsh ||
            { echo "::error::deps.qt/qt6.zsh at ${{ inputs.obs_deps_ref }} does not build Qt ${QT_VERSION}"; exit 1; }
          grep -q "Version = '${QT_VERSION}'" deps.qt/qt6.ps1 ||
            { echo "::error::deps.qt/qt6.ps1 at ${{ inputs.obs_deps_ref }} does not build Qt ${QT_VERSION}"; exit 1; }
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.1.0.app/Contents/Developer
      - name: Build Qt
        uses: ./.github/actions/build-qt
        with:
          target: ${{ matrix.target }}
          config: ${{ matrix.config }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Repack as tar.zst
        shell: bash
        env:
          OUTPUT: ${{ matrix.output }}
          PLATFORM: ${{ matrix.platform }}
          VARIANT: ${{ matrix.variant }}
          QT_VERSION: ${{ inputs.qt_version }}
          LABEL: ${{ inputs.label }}
        run: |
          shopt -s nullglob
          # obs-deps also writes a debug-symbol archive (...-dSYMs.tar.xz on macOS) beside the package.
          files=()
          for f in $OUTPUT; do
            case "$f" in *dSYMs*) ;; *) files+=("$f") ;; esac
          done
          [ "${#files[@]}" = 1 ] || { echo "::error::expected one obs-deps archive for $OUTPUT, found: ${files[*]:-none}"; exit 1; }
          mkdir stage
          case "${files[0]}" in
          *.zip) unzip -q "${files[0]}" -d stage ;;
          *.tar.xz) tar -xJf "${files[0]}" -C stage ;;
          esac
          uv run --project libs obs-studio-libs pack stage --tool qt6 --version "$QT_VERSION" \
            --platform "$PLATFORM" --variant "$VARIANT" --label "$LABEL" --out dist
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt6-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  build-linux:
    name: Qt ${{ inputs.qt_version }} (linux-x86_64)
    if: inputs.platforms != 'windows-macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build and pack
        env:
          QT_VERSION: ${{ inputs.qt_version }}
          LABEL: ${{ inputs.label }}
        run: bash recipes/linux/ci-build.sh build qt6 "$QT_VERSION" "$LABEL" .
      - name: Record provenance
        run: |
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'run=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            sha256sum recipes/linux/{Dockerfile,qt6.sh,common.sh} dist/*.tar.zst
          } > dist/provenance-linux.txt
          cat dist/provenance-linux.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt6-linux-x86_64
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, build-linux]
    # One of the build jobs is skipped when only some platforms are built.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The catalogs live on the orphan assets branch: manifest.json (the Index)
      # at its root and <tool>/manifest.json per tool, as in soldr-toolchain.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: assets
          path: assets-branch
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Attach to the release and record in the catalog
        env:
          GH_TOKEN: ${{ github.token }}
          QT_VERSION: ${{ inputs.qt_version }}
          PLATFORMS: ${{ inputs.platforms }}
          LABEL: ${{ inputs.label }}
        run: |
          tag="qt6-${QT_VERSION}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --target main --title "Qt ${QT_VERSION}" \
              --notes "Qt ${QT_VERSION} per platform; catalogued at https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/assets/manifest.json"
          # Never --clobber: published bytes are immutable (a rebuild gets a build label).
          gh release upload "$tag" dist/*.tar.zst
          uv run obs-studio-libs add dist/*.tar.zst.json --assets assets-branch
          cd assets-branch
          uvx --from git+https://github.com/zackees/manifest.json@e255ede6edf4a646a6d1031e91fd57136105a899 \
            manifest-validate manifest.json */manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json */manifest.json
          git commit -m "qt6 ${QT_VERSION}: ${PLATFORMS} assets${LABEL:+ ($LABEL)}"
          git push origin HEAD:assets
